<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- Жесткая фиксация масштаба для Android TV -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MorozLauncherTV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --accent: #0070d1;
    --accent-glow: rgba(0,112,209,0.5);
    --text: #ffffff;
    --dim: rgba(255,255,255,0.6);
    --ease-ps5: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* ТЕМЫ */
  body[data-theme="blue"]   { --accent: #0070d1; --accent-glow: rgba(0,112,209,0.5); }
  body[data-theme="red"]    { --accent: #e50914; --accent-glow: rgba(229,9,20,0.5); }
  body[data-theme="green"]  { --accent: #1db954; --accent-glow: rgba(29,185,84,0.5); }
  body[data-theme="purple"] { --accent: #9146ff; --accent-glow: rgba(145,70,255,0.5); }
  body[data-theme="orange"] { --accent: #ff6a00; --accent-glow: rgba(255,106,0,0.5); }
  body[data-theme="cyan"]   { --accent: #00d4ff; --accent-glow: rgba(0,212,255,0.5); }
  body[data-theme="pink"]   { --accent: #ff2d92; --accent-glow: rgba(255,45,146,0.5); }
  body[data-theme="gray"]   { --accent: #8b949e; --accent-glow: rgba(139,148,158,0.5); }

  /* ГЛАВНЫЙ ФИКС ВЕРСТКИ */
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden; /* Убирает любые вылезания за экран */
    background: #000;
    color: var(--text);
    font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
    user-select: none;
    position: fixed; 
    top: 0; left: 0;
  }

  /* ================= ЗАГРУЗКА 1 ================= */
  #splash1 {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    transition: opacity 0.8s var(--ease-ps5);
  }
  #splash1.hide { opacity: 0; pointer-events: none; }
  #splash1 .text {
    font-size: 3vw; font-weight: 300; letter-spacing: 0.4vw;
    animation: splashFadeIn 1s var(--ease-ps5) forwards;
  }
  @keyframes splashFadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ================= ЗАГРУЗКА 2 ================= */
  #splash2 {
    position: fixed; inset: 0; z-index: 999;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s var(--ease-ps5);
  }
  #splash2.show { opacity: 1; pointer-events: auto; }
  #splash2.hide { opacity: 0; pointer-events: none; }
  #splash2 .text {
    font-size: 2.5vw; font-weight: 600; letter-spacing: 0.6vw;
    text-shadow: 0 0 40px var(--accent-glow);
    animation: logoReveal 0.9s var(--ease-ps5) forwards;
  }
  @keyframes logoReveal {
    from { opacity: 0; transform: scale(0.9); filter: blur(8px); }
    to { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  /* ================= ГЛАВНЫЙ ЭКРАН ================= */
  #main { position: fixed; inset: 0; z-index: 1; opacity: 0; transition: opacity 1s var(--ease-ps5); }
  #main.show { opacity: 1; }

  .bg { position: absolute; inset: 0; transition: background 0.6s var(--ease-ps5); z-index: 0; }
  .bg::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, transparent 0%, rgba(0,0,0,0.85) 75%);
  }

  /* ================= ВЕРХНЯЯ ПАНЕЛЬ ================= */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; 
    height: 10vh;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 3vw; z-index: 20;
    background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
  }
  .brand { display: flex; align-items: center; gap: 1vw; font-size: 1.8vh; font-weight: 600; letter-spacing: 0.2vw; }
  .brand .dot { width: 0.8vw; height: 0.8vw; border-radius: 50%; background: var(--accent); box-shadow: 0 0 15px var(--accent); }
  .top-right { display: flex; align-items: center; gap: 1.5vw; }
  
  .clock { font-size: 2.2vh; font-weight: 400; letter-spacing: 1px; }

  .top-btn {
    width: 4.5vh; height: 4.5vh; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2vh; cursor: pointer;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.2s var(--ease-ps5);
  }
  .top-btn:hover, .top-btn.focused {
    background: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
    transform: scale(1.1);
  }

  .avatar {
    width: 4.5vh; height: 4.5vh; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #00b3ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2vh; font-weight: bold; color: #fff;
    border: 2px solid rgba(255,255,255,0.3);
    transition: all 0.3s var(--ease-ps5);
  }

  /* ================= ГЕРОЙ (ЦЕНТР) ================= */
  .hero {
    position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 2vh;
    z-index: 10; pointer-events: none;
    transition: all 0.5s var(--ease-ps5);
  }
  .hero-icon {
    width: 22vh; height: 22vh; border-radius: 4vh;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.1);
    overflow: hidden;
    transition: all 0.4s var(--ease-ps5);
  }
  .hero-icon img { width: 100%; height: 100%; object-fit: cover; }
  .hero-name { font-size: 3.5vh; font-weight: 300; letter-spacing: 1px; text-shadow: 0 4px 20px rgba(0,0,0,0.9); }

  /* ================= КАРУСЕЛЬ ================= */
  .carousel-wrap {
    position: absolute; bottom: 10vh; left: 0; right: 0; height: 18vh;
    display: flex; align-items: center; justify-content: center;
    z-index: 15; pointer-events: none;
  }
  .carousel {
    display: flex; align-items: center; gap: 2vw;
    padding: 0 50vw;
    transition: transform 0.45s var(--ease-ps5);
  }
  .tile {
    width: 12vh; height: 12vh; border-radius: 2.5vh;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    flex-shrink: 0; cursor: pointer;
    transition: all 0.4s var(--ease-ps5);
    overflow: hidden;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  
  /* Активная плитка */
  .tile.active {
    width: 18vh; height: 18vh; border-radius: 3.5vh;
    box-shadow: 0 0 0 3px #fff, 0 20px 50px var(--accent-glow);
    transform: translateY(-10px);
  }
  .tile.dim { opacity: 0.3; transform: scale(0.85); }

  /* ================= НИЖНЯЯ ПАНЕЛЬ ================= */
  .bottombar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 8vh;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 3vw; z-index: 20;
    background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
  }
  .hints { display: flex; gap: 2vw; font-size: 1.5vh; color: var(--dim); }
  .hint { display: flex; align-items: center; gap: 0.5vw; }
  .key { 
    display: inline-flex; align-items: center; justify-content: center; 
    min-width: 2.5vh; height: 2.5vh; padding: 0 0.5vw; 
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
    border-radius: 6px; font-size: 1.2vh; color: #fff; font-weight: 600; 
  }
  .app-count { font-size: 1.5vh; color: var(--dim); }

  /* ================= МОДАЛКА НАСТРОЕК ================= */
  .modal {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(20px);
    display: none; align-items: center; justify-content: center;
  }
  .modal.show { display: flex; }

  .settings-card {
    background: rgba(18,18,22,0.98);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 4vh 4vw;
    width: 100%; max-width: 60vw;
    box-shadow: 0 40px 100px rgba(0,0,0,0.8);
    animation: cardIn 0.4s var(--ease-ps5);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.94) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .settings-card h2 { font-size: 3.5vh; font-weight: 300; letter-spacing: 1px; margin-bottom: 1vh; }
  .settings-card .sub { font-size: 1.8vh; color: var(--dim); margin-bottom: 4vh; }

  .section-title {
    font-size: 1.5vh; text-transform: uppercase; letter-spacing: 2px;
    color: var(--dim); margin-bottom: 2vh; margin-top: 3vh;
  }
  .section-title:first-of-type { margin-top: 0; }

  .theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2vh; }
  .theme-swatch {
    aspect-ratio: 16/9; border-radius: 12px; cursor: pointer;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 1.5vh; font-size: 1.5vh; font-weight: 600;
    color: #fff; position: relative;
    transition: all 0.25s var(--ease-ps5);
    border: 3px solid transparent;
    overflow: hidden;
  }
  .theme-swatch::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7) 100%);
  }
  .theme-swatch span { position: relative; z-index: 2; }
  .theme-swatch:hover { transform: translateY(-4px) scale(1.02); }
  .theme-swatch.active { border-color: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
  .theme-swatch.active::before {
    content: '✓'; position: absolute; top: 10px; right: 12px;
    font-size: 2vh; color: #fff; z-index: 3; text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  }

  .settings-actions { display: flex; gap: 2vw; margin-top: 4vh; }
  .btn {
    flex: 1; padding: 2vh; border-radius: 12px; border: none;
    font-size: 1.8vh; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all 0.2s var(--ease-ps5);
  }
  .btn-ghost { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-ghost:hover { background: rgba(255,255,255,0.2); }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 10px 30px var(--accent-glow); }
  .btn-primary:hover { transform: translateY(-2px); }

  /* ================= TOAST ================= */
  .toast {
    position: fixed; bottom: 15vh; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(20,20,26,0.98);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 2vh 4vh; border-radius: 40px;
    font-size: 1.8vh; opacity: 0; pointer-events: none;
    transition: all 0.3s var(--ease-ps5);
    z-index: 1000; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body data-theme="blue">

<!-- Загрузка 1 -->
<div id="splash1"><div class="text">By Moroz</div></div>

<!-- Загрузка 2 -->
<div id="splash2"><div class="text">MorozLauncherTV</div></div>

<!-- Главный экран -->
<div id="main">
  <div class="bg" id="bg"></div>

  <!-- Верхняя панель -->
  <div class="topbar">
    <div class="brand"><span class="dot"></span>MOROZ LAUNCHER</div>
    <div class="top-right">
      <div class="clock" id="clock">00:00</div>
      <div class="top-btn" id="btnSettings" title="Настройки" tabindex="0">⚙️</div>
      <div class="avatar" id="avatar">M</div>
    </div>
  </div>

  <!-- Центральный герой -->
  <div class="hero" id="hero">
    <div class="hero-icon" id="heroIcon">📱</div>
    <div class="hero-name" id="heroName">Загрузка...</div>
  </div>

  <!-- Карусель приложений -->
  <div class="carousel-wrap">
    <div class="carousel" id="carousel"></div>
  </div>

  <!-- Нижняя панель -->
  <div class="bottombar">
    <div class="hints">
      <div class="hint"><span class="key">◀ ▶</span> выбор</div>
      <div class="hint"><span class="key">OK</span> открыть</div>
      <div class="hint"><span class="key">⚙</span> настройки</div>
    </div>
    <div class="app-count" id="appCount">0 приложений</div>
  </div>
</div>

<!-- Модалка настроек -->
<div class="modal" id="settingsModal">
  <div class="settings-card">
    <h2>Настройки</h2>
    <div class="sub">Персонализируй MorozLauncherTV</div>

    <div class="section-title">Цветовая тема</div>
    <div class="theme-grid" id="themeGrid"></div>

    <div class="settings-actions">
      <button class="btn btn-ghost" id="btnCloseSettings">Закрыть</button>
      <button class="btn btn-primary" id="btnOpenAndroid">Настройки Android</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ТЕМЫ
   ============================================================ */
const THEMES = [
  { id: 'blue',   name: 'PS5',    color: '#0070d1' },
  { id: 'red',    name: 'Red',    color: '#e50914' },
  { id: 'green',  name: 'Green',  color: '#1db954' },
  { id: 'purple', name: 'Purple', color: '#9146ff' },
  { id: 'orange', name: 'Orange', color: '#ff6a00' },
  { id: 'cyan',   name: 'Cyan',   color: '#00d4ff' },
  { id: 'pink',   name: 'Pink',   color: '#ff2d92' },
  { id: 'gray',   name: 'Gray',   color: '#8b949e' },
];

/* ================= СОСТОЯНИЕ ================= */
const STORAGE_KEY = 'moroz_launcher_settings';
let settings = { theme: 'blue' };

function loadSettings() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) settings = { ...settings, ...JSON.parse(saved) };
  } catch {}
  applySettings();
}

function saveSettings() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
  applySettings();
}

function applySettings() {
  document.body.dataset.theme = settings.theme;
  document.querySelectorAll('.theme-swatch').forEach(el => {
    el.classList.toggle('active', el.dataset.theme === settings.theme);
  });
  updateBgForTheme();
}

/* ================= ЗАГРУЗКА ================= */
const splash1 = document.getElementById('splash1');
const splash2 = document.getElementById('splash2');
const mainEl = document.getElementById('main');

setTimeout(() => {
  splash1.classList.add('hide');
  splash2.classList.add('show');
}, 3000);

setTimeout(() => {
  splash2.classList.remove('show');
  splash2.classList.add('hide');
  mainEl.classList.add('show');
  initLauncher();
}, 6000);

/* ================= ЛАУНЧЕР ================= */
let apps = [];
let currentIndex = 0;

const carousel = document.getElementById('carousel');
const heroIcon = document.getElementById('heroIcon');
const heroName = document.getElementById('heroName');
const bgEl = document.getElementById('bg');

function renderIcon(icon) {
  if (icon && icon.startsWith('data:image')) return `<img src="${icon}" alt="">`;
  return '<span style="font-size: 3vh;">📱</span>';
}

function updateBgForTheme() {
  const theme = THEMES.find(t => t.id === settings.theme);
  const c = theme ? theme.color : '#0070d1';
  bgEl.style.background = `radial-gradient(circle at 50% 45%, ${c}44 0%, #050508 70%)`;
}

function initLauncher() {
  if (!window.AndroidBridge) {
    heroName.textContent = 'Ошибка моста';
    return;
  }

  try {
    apps = JSON.parse(AndroidBridge.getApps());
  } catch {
    heroName.textContent = 'Ошибка загрузки';
    return;
  }

  if (!apps.length) {
    heroName.textContent = 'Нет приложений';
    return;
  }

  apps.sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById('appCount').textContent = apps.length + ' приложений';

  carousel.innerHTML = '';
  apps.forEach((app, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = renderIcon(app.icon);
    tile.addEventListener('click', () => setCurrent(i));
    carousel.appendChild(tile);
  });

  setCurrent(0);
  tickClock();
  setInterval(tickClock, 1000);

  document.addEventListener('keydown', (e) => {
    if (document.getElementById('settingsModal').classList.contains('show')) {
      if (e.key === 'Escape') closeSettings();
      return;
    }
    switch (e.key) {
      case 'ArrowLeft': e.preventDefault(); setCurrent(currentIndex - 1); break;
      case 'ArrowRight': e.preventDefault(); setCurrent(currentIndex + 1); break;
      case 'Enter': e.preventDefault(); launch(apps[currentIndex]); break;
      case 'F2':
      case 'ContextMenu': e.preventDefault(); openSettings(); break;
    }
  });
}

function setCurrent(i) {
  if (!apps.length) return;
  currentIndex = Math.max(0, Math.min(i, apps.length - 1));
  const app = apps[currentIndex];

  heroIcon.innerHTML = renderIcon(app.icon);
  heroName.textContent = app.name;

  const tiles = carousel.querySelectorAll('.tile');
  tiles.forEach((tile, idx) => {
    tile.classList.toggle('active', idx === currentIndex);
    tile.classList.toggle('dim', Math.abs(idx - currentIndex) > 2);
  });

  const activeTile = tiles[currentIndex];
  if (activeTile) {
    const offset = activeTile.offsetLeft - (window.innerWidth / 2) + (activeTile.offsetWidth / 2);
    carousel.style.transform = `translateX(${-offset}px)`;
  }
}

function launch(app) {
  if (window.AndroidBridge) AndroidBridge.launchApp(app.package);
}

function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
}

/* ================= НАСТРОЙКИ ================= */
const settingsModal = document.getElementById('settingsModal');

function openSettings() {
  settingsModal.classList.add('show');
}
function closeSettings() {
  settingsModal.classList.remove('show');
}

document.getElementById('btnSettings').addEventListener('click', openSettings);
document.getElementById('btnCloseSettings').addEventListener('click', closeSettings);

document.getElementById('btnOpenAndroid').addEventListener('click', () => {
  if (window.AndroidBridge) AndroidBridge.openSettings();
  else toast('Недоступно');
});

settingsModal.addEventListener('click', (e) => {
  if (e.target === settingsModal) closeSettings();
});

const themeGrid = document.getElementById('themeGrid');
THEMES.forEach(t => {
  const el = document.createElement('div');
  el.className = 'theme-swatch';
  el.dataset.theme = t.id;
  el.style.background = `linear-gradient(135deg, ${t.color}, ${t.color}88)`;
  el.innerHTML = `<span>${t.name}</span>`;
  el.addEventListener('click', () => {
    settings.theme = t.id;
    saveSettings();
    toast(`Тема: ${t.name}`);
  });
  themeGrid.appendChild(el);
});

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ================= СТАРТ ================= */
loadSettings();
window.addEventListener('resize', () => setCurrent(currentIndex));
</script>
</body>
</html>
