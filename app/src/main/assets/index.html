<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MorozLauncherTV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --accent: #0070d1;
    --accent-glow: rgba(0,112,209,0.6);
    --text: #ffffff;
    --dim: rgba(255,255,255,0.6);
    /* Плавная пружинная анимация как в консолях */
    --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* ТЕМЫ */
  body[data-theme="blue"]   { --accent: #0070d1; --accent-glow: rgba(0,112,209,0.6); }
  body[data-theme="red"]    { --accent: #e50914; --accent-glow: rgba(229,9,20,0.6); }
  body[data-theme="green"]  { --accent: #1db954; --accent-glow: rgba(29,185,84,0.6); }
  body[data-theme="purple"] { --accent: #9146ff; --accent-glow: rgba(145,70,255,0.6); }
  body[data-theme="orange"] { --accent: #ff6a00; --accent-glow: rgba(255,106,0,0.6); }
  body[data-theme="cyan"]   { --accent: #00d4ff; --accent-glow: rgba(0,212,255,0.6); }
  body[data-theme="pink"]   { --accent: #ff2d92; --accent-glow: rgba(255,45,146,0.6); }

  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #000; color: var(--text);
    font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
    user-select: none; position: fixed; top: 0; left: 0;
    display: flex; flex-direction: column;
  }

  /* ================= ФОН И ЧАСТИЦЫ ================= */
  .bg-ambient {
    position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(circle at 50% 50%, #1a1a24 0%, #000 100%);
    transition: background 1s var(--ease-out);
  }
  .bg-glow {
    position: absolute; top: 50%; left: 50%; width: 150vw; height: 150vh;
    transform: translate(-50%, -50%); z-index: 0; opacity: 0.4;
    background: radial-gradient(circle at center, var(--accent) 0%, transparent 60%);
    filter: blur(100px); transition: background 0.8s var(--ease-out);
    animation: ambientPulse 8s infinite alternate ease-in-out;
  }
  @keyframes ambientPulse {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
    100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.5; }
  }

  /* ================= ЗАГРУЗКА ================= */
  #splash {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: #000; transition: opacity 1s var(--ease-out);
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  .splash-logo {
    font-size: 3vw; font-weight: 300; letter-spacing: 0.8vw; color: #fff;
    animation: splashIn 1.5s var(--spring) forwards;
  }
  .splash-sub {
    font-size: 1vw; color: var(--dim); letter-spacing: 0.5vw; opacity: 0;
    animation: fadeIn 1.5s 0.5s var(--ease-out) forwards;
  }
  .splash-loader {
    width: 200px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 30px; overflow: hidden;
  }
  .splash-loader-bar {
    height: 100%; width: 0%; background: var(--accent); border-radius: 2px;
    animation: loadBar 3s var(--ease-out) forwards;
    box-shadow: 0 0 10px var(--accent);
  }
  @keyframes splashIn { from { opacity: 0; transform: translateY(20px) scale(0.95); filter: blur(10px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes loadBar { 0% { width: 0%; } 50% { width: 60%; } 100% { width: 100%; } }

  /* ================= ГЛАВНЫЙ ЭКРАН ================= */
  #main { position: relative; z-index: 1; width: 100%; height: 100%; opacity: 0; transition: opacity 1s var(--ease-out); }
  #main.show { opacity: 1; }

  /* ВЕРХНЯЯ ПАНЕЛЬ */
  .topbar {
    position: absolute; top: 0; left: 0; width: 100%; height: 10vh;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4vw; z-index: 20;
    background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
  }
  .brand { display: flex; align-items: center; gap: 1vw; font-size: 1.6vw; font-weight: 600; letter-spacing: 0.2vw; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 15px var(--accent); }
  .top-right { display: flex; align-items: center; gap: 1.5vw; }
  .clock { font-size: 2vw; font-weight: 300; }
  .avatar {
    width: 3.5vw; height: 3.5vw; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #fff);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5vw; font-weight: bold; color: #000;
    box-shadow: 0 0 20px var(--accent-glow);
  }

  /* ЦЕНТР (ГЕРОЙ) */
  .hero {
    position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 2vh;
    z-index: 10; pointer-events: none;
    transition: transform 0.5s var(--spring);
  }
  .hero-icon-wrap {
    position: relative;
    width: 18vw; height: 18vw; border-radius: 3vw;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
    box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.1);
    overflow: hidden;
    animation: floatIcon 6s infinite ease-in-out;
  }
  @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .hero-icon-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .hero-name {
    font-size: 2.5vw; font-weight: 300; letter-spacing: 1px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    animation: fadeIn 1s var(--ease-out);
  }

  /* КАРУСЕЛЬ */
  .carousel-wrap {
    position: absolute; bottom: 12vh; left: 0; width: 100%; height: 16vw;
    display: flex; align-items: center; justify-content: center;
    z-index: 15; pointer-events: none;
    overflow: hidden;
  }
  .carousel {
    display: flex; align-items: center; gap: 2vw; padding: 0 50vw;
    transition: transform 0.6s var(--spring);
  }
  .tile {
    width: 8vw; height: 8vw; border-radius: 1.5vw;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08); backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    flex-shrink: 0; cursor: pointer;
    transition: all 0.5s var(--spring);
    overflow: hidden; opacity: 0.7;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  .tile.active {
    width: 12vw; height: 12vw; border-radius: 2vw;
    box-shadow: 0 0 0 4px #fff, 0 20px 60px var(--accent-glow);
    transform: translateY(-20px); opacity: 1;
  }
  .tile.dim { opacity: 0.3; transform: scale(0.85); }

  /* НИЖНЯЯ ПАНЕЛЬ */
  .bottombar {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 8vh;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4vw; z-index: 20;
    background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
  }
  .hints { display: flex; gap: 2vw; font-size: 1.2vw; color: var(--dim); }
  .hint { display: flex; align-items: center; gap: 0.5vw; }
  .key { 
    display: inline-flex; align-items: center; justify-content: center; 
    min-width: 2vw; height: 2vw; padding: 0 0.5vw; 
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
    border-radius: 6px; font-size: 1vw; color: #fff; font-weight: 600; 
  }

  /* ================= МЕНЮ БЫСТРЫХ ДЕЙСТВИЙ ================= */
  .quick-menu-overlay {
    position: fixed; inset: 0; z-index: 900;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s var(--ease-out);
  }
  .quick-menu-overlay.show { opacity: 1; pointer-events: auto; }
  
  .quick-menu {
    background: rgba(20,20,28,0.95);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 2vw; padding: 3vw;
    display: flex; flex-direction: column; gap: 1.5vw;
    transform: scale(0.9) translateY(20px); opacity: 0;
    transition: all 0.4s var(--spring);
    box-shadow: 0 30px 100px rgba(0,0,0,0.9);
  }
  .quick-menu-overlay.show .quick-menu { transform: scale(1) translateY(0); opacity: 1; }

  .quick-menu h3 { font-size: 2vw; font-weight: 300; margin-bottom: 1vw; text-align: center; }
  
  .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1vw; }
  
  .quick-btn {
    width: 8vw; height: 8vw; border-radius: 1.5vw;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5vw;
    font-size: 1.2vw; color: #fff; cursor: pointer;
    transition: all 0.3s var(--spring);
  }
  .quick-btn span { font-size: 2.5vw; }
  .quick-btn:hover, .quick-btn:focus {
    background: var(--accent); border-color: var(--accent);
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 15px 30px var(--accent-glow);
    outline: none;
  }

  /* ================= ТОСТ ================= */
  .toast {
    position: fixed; bottom: 15vh; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(20,20,26,0.98); border: 1px solid rgba(255,255,255,0.15);
    padding: 1.5vh 3vw; border-radius: 40px; font-size: 1.5vw;
    opacity: 0; pointer-events: none; transition: all 0.3s var(--spring); z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body data-theme="blue">

<!-- Анимированный фон -->
<div class="bg-ambient"></div>
<div class="bg-glow" id="bgGlow"></div>

<!-- Экран загрузки -->
<div id="splash">
  <div class="splash-logo">MorozLauncherTV</div>
  <div class="splash-sub">PREMIUM EDITION</div>
  <div class="splash-loader"><div class="splash-loader-bar"></div></div>
</div>

<!-- Главный экран -->
<div id="main">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>MOROZ LAUNCHER</div>
    <div class="top-right">
      <div class="clock" id="clock">00:00</div>
      <div class="avatar">M</div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-icon-wrap" id="heroIcon">📱</div>
    <div class="hero-name" id="heroName">Загрузка...</div>
  </div>

  <div class="carousel-wrap">
    <div class="carousel" id="carousel"></div>
  </div>

  <div class="bottombar">
    <div class="hints">
      <div class="hint"><span class="key">◀ ▶</span> выбор</div>
      <div class="hint"><span class="key">OK</span> открыть</div>
      <div class="hint"><span class="key">Hold OK</span> меню</div>
    </div>
  </div>
</div>

<!-- Меню быстрых действий -->
<div class="quick-menu-overlay" id="quickMenuOverlay">
  <div class="quick-menu">
    <h3>Быстрые действия</h3>
    <div class="quick-grid">
      <div class="quick-btn" onclick="quickAction('settings')">
        <span>⚙️</span> Настройки
      </div>
      <div class="quick-btn" onclick="quickAction('theme')">
        <span>🎨</span> Сменить тему
      </div>
      <div class="quick-btn" onclick="quickAction('reload')">
        <span>🔄</span> Обновить
      </div>
      <div class="quick-btn" onclick="quickAction('android')">
        <span>🤖</span> Android
      </div>
      <div class="quick-btn" onclick="quickAction('random')">
        <span>🎲</span> Рандом
      </div>
      <div class="quick-btn" onclick="quickAction('close')">
        <span>❌</span> Закрыть
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ================= СОСТОЯНИЕ ================= */
  const THEMES = ['blue', 'red', 'green', 'purple', 'orange', 'cyan', 'pink'];
  let currentThemeIndex = 0;
  let apps = [];
  let currentIndex = 0;
  let holdTimer = null;

  /* ================= ЗАГРУЗКА ================= */
  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
    document.getElementById('main').classList.add('show');
    initLauncher();
  }, 3500); // Ждем 3.5 секунды, пока идет анимация загрузки

  /* ================= ЛОГИКА ЛАУНЧЕРА ================= */
  const carousel = document.getElementById('carousel');
  const heroIcon = document.getElementById('heroIcon');
  const heroName = document.getElementById('heroName');
  const bgGlow = document.getElementById('bgGlow');

  function renderIcon(icon) {
    if (icon && icon.startsWith('data:image')) return `<img src="${icon}" alt="">`;
    return '<span style="font-size: 4vw;">📱</span>';
  }

  function initLauncher() {
    if (!window.AndroidBridge) {
      heroName.textContent = 'Ошибка Android Bridge';
      return;
    }

    try {
      apps = JSON.parse(AndroidBridge.getApps());
    } catch {
      heroName.textContent = 'Ошибка чтения приложений';
      return;
    }

    if (!apps.length) {
      heroName.textContent = 'Приложения не найдены';
      return;
    }

    apps.sort((a, b) => a.name.localeCompare(b.name));

    carousel.innerHTML = '';
    apps.forEach((app, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = renderIcon(app.icon);
      tile.addEventListener('click', () => setCurrent(i));
      carousel.appendChild(tile);
    });

    setCurrent(0);
    tickClock();
    setInterval(tickClock, 1000);
    
    // Включаем управление пультом
    setupRemoteControl();
  }

  function setCurrent(i) {
    if (!apps.length) return;
    currentIndex = Math.max(0, Math.min(i, apps.length - 1));
    const app = apps[currentIndex];

    // Анимация смены иконок
    heroIcon.style.transform = 'scale(0.9)';
    setTimeout(() => {
      heroIcon.innerHTML = renderIcon(app.icon);
      heroName.textContent = app.name;
      heroIcon.style.transform = 'scale(1)';
    }, 150);

    const tiles = carousel.querySelectorAll('.tile');
    tiles.forEach((tile, idx) => {
      tile.classList.toggle('active', idx === currentIndex);
      tile.classList.toggle('dim', Math.abs(idx - currentIndex) > 2);
    });

    const activeTile = tiles[currentIndex];
    if (activeTile) {
      const offset = activeTile.offsetLeft - (window.innerWidth / 2) + (activeTile.offsetWidth / 2);
      carousel.style.transform = `translateX(${-offset}px)`;
    }
  }

  function tickClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  }

  /* ================= УПРАВЛЕНИЕ ПУЛЬТОМ ================= */
  function setupRemoteControl() {
    document.addEventListener('keydown', (e) => {
      // Если открыто меню быстрых действий
      if (document.getElementById('quickMenuOverlay').classList.contains('show')) {
        if (e.key === 'Escape' || e.key === 'Backspace') closeQuickMenu();
        return;
      }

      switch (e.key) {
        case 'ArrowLeft': 
          e.preventDefault(); 
          setCurrent(currentIndex - 1); 
          break;
        case 'ArrowRight': 
          e.preventDefault(); 
          setCurrent(currentIndex + 1); 
          break;
        case 'Enter': 
          e.preventDefault();
          // Запуск приложения по короткому нажатию
          if (window.AndroidBridge && apps[currentIndex]) {
            AndroidBridge.launchApp(apps[currentIndex].package);
          }
          break;
        case 'ContextMenu':
        case 'F2':
          e.preventDefault();
          openQuickMenu();
          break;
      }
    });

    // Обработка долгого нажатия OK (Enter) для вызова меню
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        holdTimer = setTimeout(() => {
          openQuickMenu();
        }, 600); // 600 мс — долгое нажатие
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') {
        clearTimeout(holdTimer);
      }
    });
  }

  /* ================= МЕНЮ БЫСТРЫХ ДЕЙСТВИЙ ================= */
  const quickMenuOverlay = document.getElementById('quickMenuOverlay');

  function openQuickMenu() {
    quickMenuOverlay.classList.add('show');
    // Фокусируемся на первой кнопке для управления пультом
    setTimeout(() => {
      const firstBtn = document.querySelector('.quick-btn');
      if (firstBtn) firstBtn.focus();
    }, 100);
  }

  function closeQuickMenu() {
    quickMenuOverlay.classList.remove('show');
  }

  quickMenuOverlay.addEventListener('click', (e) => {
    if (e.target === quickMenuOverlay) closeQuickMenu();
  });

  function quickAction(action) {
    switch (action) {
      case 'settings':
        toast('Настройки пока в разработке');
        break;
      case 'theme':
        currentThemeIndex = (currentThemeIndex + 1) % THEMES.length;
        const newTheme = THEMES[currentThemeIndex];
        document.body.dataset.theme = newTheme;
        
        // Меняем цвет свечения на фоне
        const colors = {
          blue: '#0070d1', red: '#e50914', green: '#1db954', 
          purple: '#9146ff', orange: '#ff6a00', cyan: '#00d4ff', pink: '#ff2d92'
        };
        bgGlow.style.background = `radial-gradient(circle at center, ${colors[newTheme]} 0%, transparent 60%)`;
        toast('Тема изменена: ' + newTheme);
        break;
      case 'reload':
        location.reload();
        break;
      case 'android':
        if (window.AndroidBridge) AndroidBridge.openSettings();
        break;
      case 'random':
        const rand = Math.floor(Math.random() * apps.length);
        setCurrent(rand);
        toast('Случайное приложение: ' + apps[rand].name);
        closeQuickMenu();
        break;
      case 'close':
        closeQuickMenu();
        break;
    }
  }

  /* ================= ТОСТ ================= */
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
