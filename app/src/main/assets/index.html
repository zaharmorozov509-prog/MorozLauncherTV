<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MorozLauncherTV</title>
<style>
  /* =========================================
     ПОЛНОЕ ОТКЛЮЧЕНИЕ АНИМАЦИЙ
     ========================================= */
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
    transition: none !important; 
    animation: none !important;
  }
  
  :root { 
    --ps-blue: #0070d1; 
    --text: #ffffff; 
    --dim: rgba(255, 255, 255, 0.5); 
  }

  /* ТЕМЫ */
  body[data-theme="blue"]   { --ps-blue: #0070d1; }
  body[data-theme="red"]    { --ps-blue: #e50914; }
  body[data-theme="green"]  { --ps-blue: #1db954; }
  body[data-theme="purple"] { --ps-blue: #9146ff; }

  html, body { 
    width: 100vw; 
    height: 100vh; 
    overflow: hidden; 
    background: #000; 
    color: var(--text); 
    font-family: 'Segoe UI', -apple-system, sans-serif; 
    user-select: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
  }

  /* =========================================
     ГЛУБОКИЙ ФОН PS5
     ========================================= */
  .bg-base {
    position: absolute; 
    inset: 0; 
    z-index: 0;
    background: radial-gradient(circle at 50% 30%, #0a1730 0%, #000000 70%);
  }
  
  .bg-ambient {
    position: absolute; 
    top: 30%; 
    left: 50%; 
    transform: translate(-50%, -50%); 
    width: 60vw; 
    height: 60vh;
    background: radial-gradient(circle, var(--ps-blue) 0%, transparent 70%);
    z-index: 1; 
    pointer-events: none;
    opacity: 0.15; /* Мягкое свечение от темы */
  }

  #customWallpaper { 
    position: absolute; 
    inset: 0; 
    z-index: 0; 
    background-size: cover; 
    background-position: center; 
    display: none; 
    opacity: 0.15; 
  }

  /* =========================================
     ВЕРХНЯЯ ПАНЕЛЬ (Как на PS5)
     ========================================= */
  .topbar { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 8vh; 
    display: flex; 
    align-items: center; 
    justify-content: flex-end; /* Все элементы справа */
    padding: 0 4vw; 
    z-index: 20; 
  }

  .top-right { 
    display: flex; 
    align-items: center; 
    gap: 2.5vw; 
  }
  
  .weather-box { font-size: 1.6vh; font-weight: 400; color: var(--dim); }
  .battery-box { font-size: 1.6vh; color: var(--dim); }
  
  /* Часы и дата (справа, как на консоли) */
  .clock-box { 
    text-align: right; 
    line-height: 1.1; 
  }
  .clock { font-size: 2vh; font-weight: 400; }
  .date { font-size: 1.2vh; color: var(--dim); }
  
  /* Аватарка с фирменной белой обводкой */
  .avatar { 
    width: 4.5vh; 
    height: 4.5vh; 
    border-radius: 50%; 
    background: linear-gradient(135deg, var(--ps-blue), #222); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 1.8vh; 
    font-weight: 700; 
    background-size: cover; 
    background-position: center; 
    border: 2px solid #fff; 
  }

  /* =========================================
     ЦЕНТРАЛЬНЫЙ БЛОК (Иконка и Название)
     ========================================= */
  .center-stage { 
    position: absolute; 
    top: 35%; 
    left: 50%; 
    transform: translate(-50%, -50%); 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    gap: 3vh; 
    z-index: 10; 
    pointer-events: none; 
  }

  .hero-icon { 
    width: 18vh; 
    height: 18vh; 
    border-radius: 3.5vh; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    background: transparent; 
    box-shadow: 0 20px 50px rgba(0,0,0,0.9); /* Тень, парящая над фоном */
    overflow: hidden; 
  }
  
  .hero-icon img { width: 100%; height: 100%; object-fit: cover; }
  .hero-icon span { font-size: 8vh; }
  
  .hero-name { 
    font-size: 3vh; 
    font-weight: 400; 
    letter-spacing: 0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8); 
  }

  /* =========================================
     КАРУСЕЛЬ (Нижняя панель приложений)
     ========================================= */
  .carousel-wrap { 
    position: absolute; 
    bottom: 8vh; /* Прижата к низу */
    left: 0; 
    width: 100%; 
    height: 14vh; 
    display: flex; 
    align-items: center; 
    z-index: 15; 
    overflow: hidden; 
  }

  .carousel { 
    display: flex; 
    align-items: center; 
    gap: 2vw; 
    padding: 0 50vw; 
  }
  
  .tile { 
    width: 8vh; 
    height: 8vh; 
    border-radius: 2vh; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    background: rgba(255,255,255,0.1); 
    box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
    flex-shrink: 0; 
    overflow: hidden; 
    opacity: 0.4; /* Неактивные иконки тусклые */
    border: 2px solid transparent;
  }

  .tile img { width: 100%; height: 100%; object-fit: cover; }
  
  /* Активная иконка (в точности как на PS5) */
  .tile.active { 
    opacity: 1; 
    border-color: #ffffff; 
    box-shadow: 0 0 20px rgba(255,255,255,0.4), 0 10px 30px rgba(0,0,0,0.8);
  }
  .tile.active img { border-radius: 1.5vh; padding: 2px; }

  /* Настройки (системная иконка) */
  .sys-tile { background: #222; border: 2px dashed rgba(255,255,255,0.3); }
  .sys-tile span { font-size: 4vh; }

  /* =========================================
     НИЖНЯЯ ПАНЕЛЬ ПОДСКАЗОК
     ========================================= */
  .bottombar { 
    position: absolute; 
    bottom: 0; 
    left: 0; 
    width: 100%; 
    height: 6vh; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    z-index: 20; 
  }

  .hints { display: flex; gap: 3vw; font-size: 1.4vh; color: #999; }
  .hint { display: flex; align-items: center; gap: 0.5vw; }
  
  /* Круглые кнопки, как на геймпаде */
  .key { 
    display: inline-flex; 
    align-items: center; 
    justify-content: center; 
    width: 2.2vh; 
    height: 2.2vh; 
    background: #333; 
    border-radius: 50%; 
    font-size: 1.1vh; 
    color: #fff; 
    font-weight: bold; 
  }

  /* =========================================
     МОДАЛЬНОЕ ОКНО НАСТРОЕК
     ========================================= */
  .modal-overlay { 
    position: fixed; 
    inset: 0; 
    z-index: 900; 
    background: rgba(0,0,0,0.85); 
    display: none; 
    align-items: center; 
    justify-content: center; 
  }
  .modal-overlay.show { display: flex; }

  .modal-box { 
    background: #111; 
    border: 1px solid #333; 
    border-radius: 1.5vh; 
    padding: 3vh; 
    width: 75vw; 
    max-width: 900px; 
    display: flex; 
    flex-direction: column; 
    gap: 2vh; 
  }
  
  .modal-box h2 { 
    font-size: 2.2vh; 
    font-weight: 300; 
    text-align: center; 
    border-bottom: 1px solid #333; 
    padding-bottom: 1.5vh;
  }

  .section-title { 
    font-size: 1.2vh; 
    color: var(--dim); 
    text-transform: uppercase; 
    letter-spacing: 1.5px; 
    margin-top: 1vh; 
  }

  .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5vw; }
  
  .menu-btn { 
    background: #222; 
    border: 1px solid #333; 
    border-radius: 1vh; 
    padding: 1.5vh; 
    color: #fff; 
    font-size: 1.4vh; 
    cursor: pointer; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    gap: 1vh; 
  }
  
  .menu-btn:hover, .menu-btn:focus { 
    background: #444; 
    outline: none; 
    border-color: #fff;
  }
  .menu-btn span { font-size: 2.2vh; }

  /* Уведомления */
  .toast { 
    position: fixed; 
    bottom: 10vh; 
    left: 50%; 
    transform: translateX(-50%); 
    background: #111; 
    border: 1px solid #333; 
    padding: 1.5vh 2.5vw; 
    border-radius: 1vh; 
    font-size: 1.6vh; 
    opacity: 0; 
    pointer-events: none; 
    z-index: 1000; 
  }
  .toast.show { opacity: 1; }

  .update-banner {
    display: none; 
    background: #0070d1;
    color: white; 
    padding: 1vh 3vw; 
    border-radius: 1vh;
    text-align: center; 
    font-size: 1.6vh; 
    cursor: pointer;
    margin: 0 4vw;
    position: absolute;
    top: 10vh;
    width: 92vw;
  }

  .hidden-input { display: none; }
  .hidden { display: none !important; }
</style>
</head>
<body data-theme="blue">

<div class="bg-base"></div>
<div class="bg-ambient"></div>
<div id="customWallpaper"></div>

<!-- Загрузка -->
<div id="splash" style="position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; background:#000;">
  <div style="font-size:2vw; font-weight:300; letter-spacing:0.5vw; color:#fff;">MorozLauncherTV</div>
</div>

<!-- Главный экран -->
<div id="main" class="hidden" style="width:100%; height:100%; position:relative;">
  
  <!-- Верхняя панель -->
  <div class="topbar">
    <div class="top-right">
      <div class="weather-box" id="weatherBox">🌤 --°</div>
      <div class="battery-box">🔋 <span id="batteryLevel">--%</span></div>
      <div class="clock-box" id="clockBox">
        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date">Дата</div>
      </div>
      <div class="avatar" id="avatarImg">M</div>
    </div>
  </div>

  <div class="update-banner" id="updateBanner" onclick="openUpdateLink()">
    ⬇️ Доступно обновление! Нажмите для скачивания.
  </div>

  <!-- Центральный блок -->
  <div class="center-stage">
    <div class="hero-icon" id="heroIcon">📱</div>
    <div class="hero-name" id="heroName">Загрузка...</div>
  </div>

  <!-- Карусель -->
  <div class="carousel-wrap">
    <div class="carousel" id="carousel"></div>
  </div>

  <!-- Нижняя панель -->
  <div class="bottombar">
    <div class="hints">
      <div class="hint"><span class="key">◀</span> <span class="key">▶</span> выбор</div>
      <div class="hint"><span class="key">X</span> открыть</div>
    </div>
  </div>
</div>

<!-- Настройки -->
<div class="modal-overlay" id="settingsMenu">
  <div class="modal-box">
    <h2>Настройки</h2>
    <div class="section-title">Обновление</div>
    <div class="menu-grid">
      <div class="menu-btn" onclick="checkForUpdates(true)">🔄 Проверить обновления</div>
    </div>
    <div class="section-title">Цветовая тема</div>
    <div class="menu-grid">
      <div class="menu-btn" onclick="setTheme('blue')">🔵 Синяя</div>
      <div class="menu-btn" onclick="setTheme('red')">🔴 Красная</div>
      <div class="menu-btn" onclick="setTheme('green')">🟢 Зеленая</div>
      <div class="menu-btn" onclick="setTheme('purple')">🟣 Фиолет</div>
    </div>
    <div class="section-title">Обои и Аватар</div>
    <div class="menu-grid">
      <div class="menu-btn" onclick="document.getElementById('fileWallpaper').click()">📸 Обои</div>
      <div class="menu-btn" onclick="document.getElementById('fileAvatar').click()">🖼 Аватар</div>
      <div class="menu-btn" onclick="resetWallpaper()">🗑 Сброс</div>
      <div class="menu-btn" onclick="action('android')">🤖 Android</div>
    </div>
    <div class="menu-btn" style="margin-top: 2vh; background: #333;" onclick="closeModals()">🔙 Закрыть</div>
  </div>
</div>

<input type="file" id="fileWallpaper" accept="image/*" class="hidden-input" onchange="handleWallpaperUpload(event)">
<input type="file" id="fileAvatar" accept="image/*" class="hidden-input" onchange="handleAvatarUpload(event)">
<div class="toast" id="toast"></div>

<script>
  const GITHUB_USER = "zaharmorozov509-prog";
  const GITHUB_REPO = "MorozLauncherTV";
  const CURRENT_VERSION = "2.1.0";

  let settings = {
    name: localStorage.getItem('userName') || 'Друг',
    theme: localStorage.getItem('theme') || 'blue',
  };
  
  let apps = [];
  let currentIndex = 0;
  let updateUrl = null;

  document.body.dataset.theme = settings.theme;

  const savedWallpaper = localStorage.getItem('customWallpaper');
  if (savedWallpaper) {
    document.getElementById('customWallpaper').style.backgroundImage = `url(${savedWallpaper})`;
    document.getElementById('customWallpaper').style.display = 'block';
  }

  async function checkForUpdates(manual = false) {
    if (manual) toast('Проверка...');
    try {
      const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/releases/latest`);
      const data = await response.json();
      const latestVersion = data.tag_name.replace('v', '');
      
      if (latestVersion !== CURRENT_VERSION) {
        const apkAsset = data.assets.find(a => a.name.endsWith('.apk'));
        if (apkAsset) {
          updateUrl = apkAsset.browser_download_url;
          document.getElementById('updateBanner').style.display = 'block';
          document.getElementById('updateBanner').innerText = `⬇️ Доступно обновление v${latestVersion}! Нажмите здесь.`;
          if (manual) toast(`Найдено обновление: v${latestVersion}`);
        } else {
          if (manual) toast('В релизе нет APK-файла');
        }
      } else {
        if (manual) toast('У вас последняя версия!');
      }
    } catch (e) {
      if (manual) toast('Ошибка проверки');
    }
  }

  function openUpdateLink() {
    if (updateUrl) window.open(updateUrl, '_blank');
  }

  setTimeout(() => checkForUpdates(false), 3000);

  async function fetchWeather() {
    try {
      const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=55.75&longitude=37.61&current_weather=true');
      const data = await response.json();
      const temp = Math.round(data.current_weather.temperature);
      document.getElementById('weatherBox').innerText = `🌤 +${temp}°`;
    } catch (e) { }
  }
  fetchWeather();

  if (window.AndroidBridge && window.AndroidBridge.getRemoteBattery) {
    try {
      const level = window.AndroidBridge.getRemoteBattery();
      document.getElementById('batteryLevel').innerText = (level > 0) ? `${level}%` : `--%`;
    } catch(e) { }
  }

  window.onload = () => {
    setTimeout(() => {
      document.getElementById('splash').style.display = 'none';
      startMainApp();
    }, 1000);
  };

  function startMainApp() {
    document.getElementById('main').classList.remove('hidden');
    
    const avatarEl = document.getElementById('avatarImg');
    const savedAvatar = localStorage.getItem('customAvatar');
    if (savedAvatar) {
      avatarEl.style.backgroundImage = `url(${savedAvatar})`;
      avatarEl.innerText = '';
    } else {
      avatarEl.innerText = settings.name.charAt(0).toUpperCase();
    }

    initLauncher();
    tickClock();
    setInterval(tickClock, 1000);
    setupControls();
  }

  const carousel = document.getElementById('carousel');
  const heroIcon = document.getElementById('heroIcon');
  const heroName = document.getElementById('heroName');

  function initLauncher() {
    if (!window.AndroidBridge) return;
    try { apps = JSON.parse(AndroidBridge.getApps()); } catch { return; }
    
    apps.sort((a, b) => a.name.localeCompare(b.name));
    apps.unshift({ name: "Настройки", package: "SYSTEM_SETTINGS", icon: "" });

    carousel.innerHTML = '';
    apps.forEach((app, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      
      if (app.package === "SYSTEM_SETTINGS") {
        tile.classList.add('sys-tile');
        tile.innerHTML = '<span>⚙️</span>';
      } else {
        tile.innerHTML = (app.icon && app.icon.startsWith('data:image')) ? `<img src="${app.icon}">` : '<span style="font-size: 3vh;">📱</span>';
      }
      
      tile.onclick = () => { setCurrent(i); openApp(app); };
      carousel.appendChild(tile);
    });
    setCurrent(0);
  }

  function setCurrent(i) {
    if (!apps.length) return;
    currentIndex = Math.max(0, Math.min(i, apps.length - 1));
    const app = apps[currentIndex];

    if (app.package === "SYSTEM_SETTINGS") {
      heroIcon.innerHTML = '<span>⚙️</span>';
      heroName.textContent = app.name;
    } else {
      heroIcon.innerHTML = (app.icon && app.icon.startsWith('data:image')) ? `<img src="${app.icon}">` : '<span style="font-size: 6vh;">📱</span>';
      heroName.textContent = app.name;
    }

    const tiles = carousel.querySelectorAll('.tile');
    tiles.forEach((tile, idx) => {
      tile.classList.toggle('active', idx === currentIndex);
    });

    const activeTile = tiles[currentIndex];
    if (activeTile) {
      const offset = activeTile.offsetLeft - (window.innerWidth / 2) + (activeTile.offsetWidth / 2);
      carousel.style.transform = `translateX(${-offset}px)`;
    }
  }

  function openApp(app) {
    if (app.package === "SYSTEM_SETTINGS") {
      openModal('settingsMenu');
    } else {
      if (window.AndroidBridge) AndroidBridge.launchApp(app.package);
    }
  }

  function tickClock() {
    const now = new Date();
    document.getElementById('clock').textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    document.getElementById('date').textContent = now.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function handleWallpaperUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const base64 = e.target.result;
      document.getElementById('customWallpaper').style.backgroundImage = `url(${base64})`;
      document.getElementById('customWallpaper').style.display = 'block';
      localStorage.setItem('customWallpaper', base64);
      toast('Обои установлены');
    };
    reader.readAsDataURL(file);
  }

  function handleAvatarUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const base64 = e.target.result;
      const avatarEl = document.getElementById('avatarImg');
      avatarEl.style.backgroundImage = `url(${base64})`;
      avatarEl.innerText = ''; 
      localStorage.setItem('customAvatar', base64);
      toast('Аватарка обновлена');
    };
    reader.readAsDataURL(file);
  }

  function resetWallpaper() {
    localStorage.removeItem('customWallpaper');
    document.getElementById('customWallpaper').style.display = 'none';
    toast('Обои сброшены');
  }

  function setupControls() {
    document.addEventListener('keydown', (e) => {
      const activeModal = document.querySelector('.modal-overlay.show');
      if (activeModal) {
        if (e.key === 'Escape' || e.key === 'Backspace') closeModals();
        if (e.key === 'Enter') document.activeElement.click();
        return;
      }
      
      switch (e.key) {
        case 'ArrowLeft': e.preventDefault(); setCurrent(currentIndex - 1); break;
        case 'ArrowRight': e.preventDefault(); setCurrent(currentIndex + 1); break;
        case 'Enter': e.preventDefault(); if (apps[currentIndex]) openApp(apps[currentIndex]); break;
      }
    });
  }

  function openModal(id) {
    document.getElementById(id).classList.add('show');
    setTimeout(() => { const btn = document.querySelector(`#${id} .menu-btn`); if (btn) btn.focus(); }, 50);
  }
  
  function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show')); }

  function setTheme(theme) {
    settings.theme = theme; document.body.dataset.theme = theme;
    localStorage.setItem('theme', theme); toast('Тема изменена');
  }

  function action(type) {
    if (type === 'android') { if (window.AndroidBridge) AndroidBridge.openSettings(); }
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
