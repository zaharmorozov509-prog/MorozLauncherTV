<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MorozLauncherTV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --accent: #0070d1;
    --accent-glow: rgba(0,112,209,0.4);
    --text: #ffffff;
    --dim: rgba(255,255,255,0.6);
  }

  body[data-theme="blue"]   { --accent: #0070d1; --accent-glow: rgba(0,112,209,0.4); }
  body[data-theme="red"]    { --accent: #e50914; --accent-glow: rgba(229,9,20,0.4); }
  body[data-theme="green"]  { --accent: #1db954; --accent-glow: rgba(29,185,84,0.4); }
  body[data-theme="purple"] { --accent: #9146ff; --accent-glow: rgba(145,70,255,0.4); }

  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #0a0a0f; color: var(--text);
    font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
    user-select: none; position: fixed; top: 0; left: 0;
    display: flex; flex-direction: column;
  }

  .bg-ambient { position: absolute; inset: 0; z-index: 0; background: radial-gradient(circle at 50% 40%, rgba(30,30,45,1) 0%, #000 80%); }
  .bg-glow {
    position: absolute; top: 50%; left: 50%; width: 100vw; height: 100vh;
    transform: translate(-50%, -50%); z-index: 0; opacity: 0.2;
    background: radial-gradient(circle at center, var(--accent) 0%, transparent 60%);
    transition: background 0.3s ease;
  }

  #splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0f; transition: opacity 0.5s; }
  #splash.hide { opacity: 0; pointer-events: none; }
  .splash-logo { font-size: 3vw; font-weight: 300; letter-spacing: 0.8vw; }

  #main { position: relative; z-index: 1; width: 100%; height: 100%; opacity: 0; transition: opacity 0.5s; display: flex; flex-direction: column; }
  #main.show { opacity: 1; }

  .topbar { position: relative; width: 100%; height: 10vh; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 4vw; z-index: 20; background: linear-gradient(180deg, #0a0a0f 0%, transparent 100%); }
  .brand { display: flex; align-items: center; gap: 1vw; font-size: 1.8vh; font-weight: 600; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .top-right { display: flex; align-items: center; gap: 1.5vw; }
  .clock-box { text-align: right; line-height: 1.2; }
  .clock { font-size: 2.5vh; font-weight: 300; }
  .date { font-size: 1.5vh; color: var(--dim); }
  .avatar { width: 4.5vh; height: 4.5vh; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #333); display: flex; align-items: center; justify-content: center; font-size: 2vh; font-weight: bold; }

  .content-area { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; }

  .carousel-wrap { position: absolute; bottom: 8vh; left: 0; width: 100%; height: 18vh; display: flex; align-items: center; z-index: 15; overflow: hidden; }
  .carousel { display: flex; align-items: center; gap: 2vh; padding: 0 50vw; /* УБРАЛИ TRANSITION ДЛЯ УСТРАНЕНИЯ ЛАГОВ */ }
  
  .tile { width: 12vh; height: 12vh; border-radius: 2.5vh; display: flex; align-items: center; justify-content: center; background: #1a1a24; box-shadow: 0 5px 15px rgba(0,0,0,0.5); flex-shrink: 0; overflow: hidden; opacity: 0.6; border: 2px solid transparent; }
  .tile img { width: 100%; height: 100%; object-fit: cover; border-radius: 2.5vh; }
  .tile.active { width: 16vh; height: 16vh; border-radius: 3vh; box-shadow: 0 0 0 3px #fff, 0 10px 30px var(--accent-glow); transform: translateY(-10px); opacity: 1; transition: width 0.1s, height 0.1s; /* Легкая анимация только для размера */ }
  .tile.dim { opacity: 0.3; transform: scale(0.85); }

  .hero { display: flex; flex-direction: column; align-items: center; gap: 2vh; transform: translateY(-10%); z-index: 10; }
  .hero-icon { width: 18vh; height: 18vh; border-radius: 3.5vh; display: flex; align-items: center; justify-content: center; background: #1a1a24; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px var(--accent-glow); overflow: hidden; border: 2px solid rgba(255,255,255,0.1); }
  .hero-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 3.5vh; }
  .hero-name { font-size: 3.5vh; font-weight: 300; text-shadow: 0 4px 10px rgba(0,0,0,1); }

  .bottombar { position: relative; width: 100%; height: 8vh; flex-shrink: 0; display: flex; align-items: center; padding: 0 4vw; background: linear-gradient(0deg, #0a0a0f 0%, transparent 100%); }
  .hints { display: flex; gap: 2vw; font-size: 1.8vh; color: var(--dim); white-space: nowrap; }
  .key { display: inline-flex; align-items: center; justify-content: center; min-width: 2.5vh; height: 2.5vh; padding: 0 1vh; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; font-size: 1.2vh; color: #fff; font-weight: 600; margin-right: 0.5vw;}

  /* МОДАЛКИ */
  .modal-overlay { position: fixed; inset: 0; z-index: 900; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-box { background: #121218; border: 1px solid rgba(255,255,255,0.15); border-radius: 2vh; padding: 4vh; width: 60vw; max-width: 800px; display: flex; flex-direction: column; gap: 2vh; transform: scale(0.95); transition: transform 0.2s; }
  .modal-overlay.show .modal-box { transform: scale(1); }
  .modal-box h2 { font-size: 3vh; font-weight: 300; margin-bottom: 1vh; text-align: center; }
  
  .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2vw; }
  .menu-btn { background: #1a1a24; border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5vh; padding: 2vh; color: #fff; font-size: 1.8vh; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 1vh; transition: background 0.2s; }
  .menu-btn:hover, .menu-btn.focused { background: var(--accent); outline: none; }

  .toast { position: fixed; bottom: 12vh; left: 50%; transform: translateX(-50%) translateY(20px); background: #1a1a24; border: 1px solid rgba(255,255,255,0.15); padding: 1.5vh 3vw; border-radius: 40px; font-size: 2vh; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 1000; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body data-theme="blue">

<div class="bg-ambient"></div>
<div class="bg-glow" id="bgGlow"></div>

<div id="splash"><div class="splash-logo">MorozLauncherTV</div></div>

<div id="main">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>MOROZ LAUNCHER</div>
    <div class="top-right">
      <div class="clock-box" id="clockBox">
        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date">Дата</div>
      </div>
      <div class="avatar">M</div>
    </div>
  </div>

  <div class="content-area">
    <div class="hero" id="hero">
      <div class="hero-icon" id="heroIcon">📱</div>
      <div class="hero-name" id="heroName">Загрузка...</div>
    </div>
    <div class="carousel-wrap">
      <div class="carousel" id="carousel"></div>
    </div>
  </div>

  <div class="bottombar">
    <div class="hints">
      <div class="hint"><span class="key">◀ ▶</span> выбор</div>
      <div class="hint"><span class="key">OK</span> открыть</div>
      <div class="hint"><span class="key">Hold OK</span> меню</div>
    </div>
  </div>
</div>

<!-- Быстрое меню -->
<div class="modal-overlay" id="quickMenu">
  <div class="modal-box">
    <h2>Меню</h2>
    <div class="menu-grid">
      <div class="menu-btn" onclick="action('settings')">⚙️ Настройки</div>
      <div class="menu-btn" onclick="action('theme')">🎨 Сменить тему</div>
      <div class="menu-btn" onclick="action('random')">🎲 Рандом</div>
      <div class="menu-btn" onclick="action('close')">❌ Закрыть</div>
    </div>
  </div>
</div>

<!-- Настройки -->
<div class="modal-overlay" id="settingsMenu">
  <div class="modal-box">
    <h2>Настройки</h2>
    <div class="menu-grid">
      <div class="menu-btn" onclick="action('toggleClock')" id="btnClock">🕒 Скрыть часы</div>
      <div class="menu-btn" onclick="action('android')">🤖 Настройки Android</div>
      <div class="menu-btn" onclick="action('reload')">🔄 Перезагрузить лаунчер</div>
      <div class="menu-btn" onclick="closeModals()">🔙 Назад</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const THEMES = ['blue', 'red', 'green', 'purple'];
  let themeIdx = parseInt(localStorage.getItem('themeIdx') || '0');
  let showClock = localStorage.getItem('showClock') !== 'false';
  
  let apps = [];
  let currentIndex = 0;
  let holdTimer = null;

  document.body.dataset.theme = THEMES[themeIdx];
  if (!showClock) document.getElementById('clockBox').style.display = 'none';

  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
    document.getElementById('main').classList.add('show');
    initLauncher();
  }, 1500);

  const carousel = document.getElementById('carousel');
  const heroIcon = document.getElementById('heroIcon');
  const heroName = document.getElementById('heroName');

  function renderIcon(icon) {
    return (icon && icon.startsWith('data:image')) ? `<img src="${icon}">` : '<span style="font-size: 4vh;">📱</span>';
  }

  function initLauncher() {
    if (!window.AndroidBridge) return;
    try { apps = JSON.parse(AndroidBridge.getApps()); } catch { return; }
    if (!apps.length) return;

    apps.sort((a, b) => a.name.localeCompare(b.name));

    carousel.innerHTML = '';
    apps.forEach((app, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = renderIcon(app.icon);
      // Обработка клика (для мыши или сенсора)
      tile.onclick = () => { setCurrent(i); openApp(app); };
      carousel.appendChild(tile);
    });

    setCurrent(0);
    setInterval(tickClock, 1000);
    tickClock();
    setupControls();
  }

  function setCurrent(i) {
    if (!apps.length) return;
    currentIndex = Math.max(0, Math.min(i, apps.length - 1));
    const app = apps[currentIndex];

    heroIcon.innerHTML = renderIcon(app.icon);
    heroName.textContent = app.name;

    const tiles = carousel.querySelectorAll('.tile');
    tiles.forEach((tile, idx) => {
      tile.classList.toggle('active', idx === currentIndex);
      tile.classList.toggle('dim', Math.abs(idx - currentIndex) > 2);
    });

    // Жесткое центрирование без анимации (мгновенно, чтобы не лагало)
    const activeTile = tiles[currentIndex];
    if (activeTile) {
      const offset = activeTile.offsetLeft - (window.innerWidth / 2) + (activeTile.offsetWidth / 2);
      carousel.style.transform = `translateX(${-offset}px)`;
    }
  }

  function openApp(app) {
    if (window.AndroidBridge) AndroidBridge.launchApp(app.package);
  }

  function tickClock() {
    const now = new Date();
    document.getElementById('clock').textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    document.getElementById('date').textContent = now.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function setupControls() {
    document.addEventListener('keydown', (e) => {
      const activeModal = document.querySelector('.modal-overlay.show');
      if (activeModal) {
        if (e.key === 'Escape' || e.key === 'Backspace') closeModals();
        if (e.key === 'Enter') document.activeElement.click();
        return;
      }

      switch (e.key) {
        case 'ArrowLeft': e.preventDefault(); setCurrent(currentIndex - 1); break;
        case 'ArrowRight': e.preventDefault(); setCurrent(currentIndex + 1); break;
        case 'Enter': 
          e.preventDefault(); 
          if (apps[currentIndex]) openApp(apps[currentIndex]); 
          break;
        case 'ContextMenu': openModal('quickMenu'); break;
      }
    });

    // Долгое нажатие OK
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') holdTimer = setTimeout(() => openModal('quickMenu'), 600); });
    document.addEventListener('keyup', (e) => { if (e.key === 'Enter') clearTimeout(holdTimer); });
  }

  /* === МЕНЮ И НАСТРОЙКИ === */
  function openModal(id) {
    document.getElementById(id).classList.add('show');
    setTimeout(() => { const btn = document.querySelector(`#${id} .menu-btn`); if (btn) btn.focus(); }, 50);
  }
  function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show')); }

  function action(type) {
    switch(type) {
      case 'settings': closeModals(); openModal('settingsMenu'); break;
      case 'theme': 
        themeIdx = (themeIdx + 1) % THEMES.length;
        document.body.dataset.theme = THEMES[themeIdx];
        localStorage.setItem('themeIdx', themeIdx);
        toast('Тема: ' + THEMES[themeIdx]); break;
      case 'random': 
        setCurrent(Math.floor(Math.random() * apps.length)); closeModals(); break;
      case 'close': closeModals(); break;
      case 'toggleClock':
        showClock = !showClock;
        document.getElementById('clockBox').style.display = showClock ? 'block' : 'none';
        localStorage.setItem('showClock', showClock);
        document.getElementById('btnClock').innerText = showClock ? '🕒 Скрыть часы' : '🕒 Показать часы';
        break;
      case 'android': if (window.AndroidBridge) AndroidBridge.openSettings(); break;
      case 'reload': location.reload(); break;
    }
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
