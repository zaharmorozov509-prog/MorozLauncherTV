name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Используем v4, так как в старых версиях (v3) были проблемы с поиском пакетов
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Принудительно принимаем лицензии по правильному пути
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      # Даем права на запуск Gradle и собираем
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MorozLauncherTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
