name: APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      # 👇 ВОТ ЭТОТ ШАГ РЕШАЕТ ПРОБЛЕМУ: настраиваем Gradle 8
      - name: Setup Gradle 8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'   # Безопасная версия, совместимая с нашим Kotlin

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MorozLauncherTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
